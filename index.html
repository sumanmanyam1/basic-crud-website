```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple CRUD Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .form-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            padding: 10px;
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background-color: green;
            color: white;
        }

        .edit-btn {
            background-color: orange;
            color: white;
        }

        .delete-btn {
            background-color: red;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Simple CRUD Website</h1>

        <!-- CREATE / UPDATE FORM -->

        <div class="form-box">

            <input
                type="text"
                id="name"
                placeholder="Enter name"
            >

            <input
                type="email"
                id="email"
                placeholder="Enter email"
            >

            <button class="add-btn" onclick="addUser()">
                Add User
            </button>

        </div>


        <!-- READ DATA -->

        <h2>Users</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="userTable">

                <!-- Users will appear here -->

            </tbody>

        </table>

    </div>


    <script>

        // =========================
        // AWS API GATEWAY URL
        // =========================

        const API_URL =
            "https://ipwvwcseyf.execute-api.ap-south-1.amazonaws.com";


        // =========================
        // CREATE USER
        // =========================

        async function addUser() {

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;


            if (name === "" || email === "") {

                alert("Please enter name and email");

                return;
            }


            // Create a unique ID
            const user = {

                id: Date.now().toString(),

                name: name,

                email: email

            };


            try {

                const response = await fetch(
                    API_URL + "/contacts",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(user)

                    }
                );


                const data = await response.json();


                console.log(data);


                if (!response.ok) {

                    throw new Error(
                        data.error || "Failed to add user"
                    );

                }


                alert("User added successfully!");


                document.getElementById("name").value = "";

                document.getElementById("email").value = "";


                getUsers();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Error adding user: " +
                    error.message
                );

            }

        }


        // =========================
        // READ USERS
        // =========================

        async function getUsers() {

            try {

                const response = await fetch(
                    API_URL + "/contacts"
                );


                const users = await response.json();


                console.log(users);


                if (!response.ok) {

                    throw new Error(
                        users.error || "Failed to get users"
                    );

                }


                displayUsers(users);

            }

            catch (error) {

                console.error(error);

                alert(
                    "Error loading users: " +
                    error.message
                );

            }

        }


        // =========================
        // DISPLAY USERS
        // =========================

        function displayUsers(users) {

            const table =
                document.getElementById("userTable");


            table.innerHTML = "";


            users.forEach(user => {

                const row = `

                    <tr>

                        <td>${user.id}</td>

                        <td>${user.name}</td>

                        <td>${user.email}</td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="updateUser('${user.id}')">
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteUser('${user.id}')">
                                Delete
                            </button>

                        </td>

                    </tr>

                `;


                table.innerHTML += row;

            });

        }


        // =========================
        // UPDATE USER
        // =========================

        async function updateUser(id) {

            const name =
                prompt("Enter new name:");


            const email =
                prompt("Enter new email:");


            if (!name || !email) {

                return;

            }


            const updatedUser = {

                name: name,

                email: email

            };


            try {

                const response = await fetch(
                    API_URL + "/contacts/" + id,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(updatedUser)

                    }
                );


                const data =
                    await response.json();


                console.log(data);


                if (!response.ok) {

                    throw new Error(
                        data.error || "Failed to update user"
                    );

                }


                alert(
                    "User updated successfully!"
                );


                getUsers();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Error updating user: " +
                    error.message
                );

            }

        }


        // =========================
        // DELETE USER
        // =========================

        async function deleteUser(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this user?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                const response = await fetch(
                    API_URL + "/contacts/" + id,
                    {

                        method: "DELETE"

                    }
                );


                const data =
                    await response.json();


                console.log(data);


                if (!response.ok) {

                    throw new Error(
                        data.error || "Failed to delete user"
                    );

                }


                alert(
                    "User deleted successfully!"
                );


                getUsers();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Error deleting user: " +
                    error.message
                );

            }

        }


        // =========================
        // LOAD USERS
        // WHEN WEBSITE OPENS
        // =========================

        getUsers();

    </script>

</body>
</html>
```
